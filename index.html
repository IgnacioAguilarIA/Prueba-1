  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    header p {
      color: #94a3b8;
      font-size: 14px;
    }

    /* SELECTOR DE DÍAS */

    .days {
      display: flex;
      gap: 8px;

</head>

<body>

  <!-- ENCABEZADO -->

  <header>
    <h1>📅 Mi Planificador</h1>
    <p>Organizá tu día, hora por hora.</p>
  </header>


  <!-- DÍAS DE LA SEMANA -->

  <div class="days" id="days"></div>


  <div class="container">

    <!-- RESUMEN -->

    <div class="stats">

      <div class="stat">
        <div class="stat-number" id="totalTasks">0</div>
        <div class="stat-label">Tareas</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="todayTasks">0</div>
        <div class="stat-label">Hoy</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="freeHours">24</div>
        <div class="stat-label">Horas libres</div>
      </div>

    </div>


    <!-- HORARIOS -->

    <div class="schedule" id="schedule"></div>


    <!-- AGREGAR TAREA -->

    <div class="add-section">

      <h2>➕ Agregar tarea</h2>

      <input
        class="input"
        id="taskName"
        type="text"
        placeholder="¿Qué tenés que hacer?"
      >

      <input
        class="input"
        id="taskNote"
        type="text"
        placeholder="Descripción (opcional)"
      >

      <select class="input" id="taskHour"></select>

      <button class="add-btn" onclick="addTask()">
        Agregar tarea
      </button>

    </div>

  </div>


  <script>

    /*
      =====================================
      CONFIGURACIÓN
      =====================================
    */

    const days = [
      "Lunes",
      "Martes",
      "Miércoles",
      "Jueves",
      "Viernes",
      "Sábado",
      "Domingo"
    ];

    let selectedDay = getToday();

    let tasks =
      JSON.parse(
        localStorage.getItem("mySchedule")
      ) || [];


    /*
      =====================================
      OBTENER DÍA ACTUAL
      =====================================
    */

    function getToday() {

      const day = new Date().getDay();

      // Domingo = 0
      // Lunes = 1

      if (day === 0) {
        return 6;
      }

      return day - 1;
    }


    /*
      =====================================
      CREAR BOTONES DE DÍAS
      =====================================
    */

    function createDays() {

      const container =
        document.getElementById("days");

      container.innerHTML = "";

      days.forEach((day, index) => {

        const button =
          document.createElement("button");

        button.className = "day-btn";

        if (index === selectedDay) {
          button.classList.add("active");
        }

        button.textContent = day;

        button.onclick = () => {

          selectedDay = index;

          createDays();
          renderSchedule();

        };

        container.appendChild(button);

      });

    }


    /*
      =====================================
      CREAR SELECTOR DE HORAS
      =====================================
    */

    function createHours() {

      const select =
        document.getElementById("taskHour");

      for (let hour = 0; hour < 24; hour++) {

        const option =
          document.createElement("option");

        option.value = hour;

        option.textContent =
          String(hour).padStart(2, "0") + ":00";

        select.appendChild(option);

      }

    }


    /*
      =====================================
      MOSTRAR HORARIOS
      =====================================
    */

    function renderSchedule() {

      const schedule =
        document.getElementById("schedule");

      schedule.innerHTML = "";


      for (let hour = 0; hour < 24; hour++) {

        const hourContainer =
          document.createElement("div");

        hourContainer.className = "hour";


        /*
          HORA
        */

        const time =
          document.createElement("div");

        time.className = "time";

        time.textContent =
          String(hour).padStart(2, "0") + ":00";


        /*
          ESPACIO DE TAREAS
        */

        const slot =
          document.createElement("div");

        slot.className = "slot";


        const hourTasks =
          tasks.filter(task =>
            task.day === selectedDay &&
            task.hour === hour
          );


        /*
          SI NO HAY TAREAS
        */

        if (hourTasks.length === 0) {

          const empty =
            document.createElement("div");

          empty.className = "empty";

          empty.textContent =
            "Sin tareas";

          slot.appendChild(empty);

        }


        /*
          MOSTRAR TAREAS
        */

        hourTasks.forEach(task => {

          const taskElement =
            document.createElement("div");

          taskElement.className = "task";


          taskElement.innerHTML = `

            <button
              class="delete-btn"
              onclick="deleteTask('${task.id}')"
            >
              ×
            </button>

            <div class="task-title">
              ${escapeHTML(task.name)}
            </div>

            ${
              task.note
                ? `
                  <div class="task-note">
                    ${escapeHTML(task.note)}
                  </div>
                `
                : ""
            }

          `;

          slot.appendChild(taskElement);

        });


        hourContainer.appendChild(time);

        hourContainer.appendChild(slot);

        schedule.appendChild(hourContainer);

      }


      updateStats();

    }


    /*
      =====================================
      AGREGAR TAREA
      =====================================
    */

    function addTask() {

      const name =
        document
          .getElementById("taskName")
          .value
          .trim();


      const note =
        document
          .getElementById("taskNote")
          .value
          .trim();


      const hour =
        Number(
          document.getElementById("taskHour").value
        );


      if (!name) {

        alert("Escribí el nombre de la tarea.");

        return;

      }


      const task = {

        id:
          Date.now().toString(),

        name: name,

        note: note,

        day: selectedDay,

        hour: hour

      };


      tasks.push(task);


      saveTasks();


      document
        .getElementById("taskName")
        .value = "";


      document
        .getElementById("taskNote")
        .value = "";


      renderSchedule();

    }


    /*
      =====================================
      ELIMINAR TAREA
      =====================================
    */

    function deleteTask(id) {

      tasks =
        tasks.filter(task =>
          task.id !== id
        );


      saveTasks();

      renderSchedule();

    }


    /*
      =====================================
      GUARDAR
      =====================================
    */

    function saveTasks() {

      localStorage.setItem(
        "mySchedule",
        JSON.stringify(tasks)
      );

    }


    /*
      =====================================
      ESTADÍSTICAS
      =====================================
    */

    function updateStats() {

      const total =
        tasks.length;


      const today =
        tasks.filter(task =>
          task.day === selectedDay
        ).length;


      const usedHours =
        new Set(
          tasks
            .filter(task =>
              task.day === selectedDay
            )
            .map(task =>
              task.hour
            )
        ).size;


      document
        .getElementById("totalTasks")
        .textContent = total;


      document
        .getElementById("todayTasks")
        .textContent = today;


      document
        .getElementById("freeHours")
        .textContent =
          24 - usedHours;

    }


    /*
      =====================================
      SEGURIDAD PARA TEXTO
      =====================================
    */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /*
      =====================================
      INICIAR PÁGINA
      =====================================
    */

    createDays();

    createHours();

    renderSchedule();

  </script>

</body>
</html>
